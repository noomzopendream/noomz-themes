name: tokyo-night-day
description: TokyoNight Day-inspired light skin with blue-violet UI and vivid diagnostics

colors:
  banner_border: "#68709a"
  banner_title: "#1f2335"
  banner_accent: "#2e7de9"
  banner_dim: "#68709a"
  banner_text: "#1f2335"
  ui_accent: "#2e7de9"
  ui_label: "#7847bd"
  ui_ok: "#587539"
  ui_error: "#c64343"
  ui_warn: "#8c6c3e"
  prompt: "#1f2335"
  input_rule: "#68709a"
  response_border: "#2e7de9"
