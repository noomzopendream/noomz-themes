  status_bar_bg: "#d0d5e3"
  status_bar_text: "#1f2335"
  status_bar_strong: "#2e7de9"
  status_bar_dim: "#68709a"
  status_bar_good: "#587539"
  status_bar_warn: "#8c6c3e"
  status_bar_bad: "#b15c00"
  status_bar_critical: "#c64343"
  voice_status_bg: "#d0d5e3"
