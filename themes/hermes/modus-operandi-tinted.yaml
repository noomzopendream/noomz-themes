  banner_border: "#9f9690"
  banner_title: "#000000"
  banner_accent: "#0031a9"
  banner_dim: "#595959"
  banner_text: "#000000"
  ui_accent: "#0031a9"
  ui_label: "#721045"
  ui_ok: "#006300"
  ui_error: "#a60000"
  ui_warn: "#6d5000"
  prompt: "#000000"
  input_rule: "#721045"
  response_border: "#0031a9"
