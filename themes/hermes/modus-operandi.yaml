name: modus-operandi
description: High-contrast light Modus Operandi skin for bright terminals

colors:
  banner_border: "#313131"
  banner_title: "#000000"
  banner_accent: "#001f8c"
  banner_dim: "#404040"
  banner_text: "#000000"
  ui_accent: "#001f8c"
  ui_label: "#721045"
  ui_ok: "#006800"
  ui_error: "#a60000"
  ui_warn: "#6f5500"
  prompt: "#000000"
  input_rule: "#313131"
  response_border: "#001f8c"
  session_label: "#001f8c"
  session_border: "#404040"
  status_bar_bg: "#ebebeb"
  status_bar_text: "#000000"
  status_bar_strong: "#001f8c"
  status_bar_dim: "#404040"
  status_bar_good: "#006800"
  status_bar_warn: "#6f5500"
  status_bar_bad: "#7a230a"
  status_bar_critical: "#a60000"
  voice_status_bg: "#ebebeb"
  selection_bg: "#bed6ff"
  completion_menu_bg: "#f8f8f8"
  completion_menu_current_bg: "#bed6ff"
  completion_menu_meta_bg: "#eeeeee"
  completion_menu_meta_current_bg: "#d7e6ff"

spinner:
  waiting_faces: ["(λ)", "(μ)", "(ν)", "(∴)"]
  thinking_faces: ["(λ)", "(∫)", "(∴)", "(∵)"]
  thinking_verbs:
    - reading
    - checking contrast
    - composing
    - reasoning
    - applying changes
  wings:
    - ["⟪", "⟫"]
    - ["‹", "›"]

branding:
  agent_name: "Hermes Agent"
  welcome: "Welcome to Hermes Agent! Type your message or /help for commands."
  goodbye: "Goodbye! ⚕"
  response_label: " ⚕ Hermes "
  prompt_symbol: "❯"
  help_header: "[?] Available Commands"

tool_prefix: "│"
